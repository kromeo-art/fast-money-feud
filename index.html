<!DOCTYPE html>
<html>
<head>
    <title>Fast Money: Professional Edition</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Arial Black', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        
        /* The Board Layout */
        #board-view { display: flex; flex-direction: column; height: 100vh; background: radial-gradient(circle, #001f3f, #000); padding: 20px; box-sizing: border-box; }
        .timer { font-size: 80px; color: #ff3e3e; font-family: monospace; margin-bottom: 10px; height: 100px; }
        
        /* This creates the 5x2 grid */
        .board-container { display: flex; justify-content: center; gap: 40px; flex-grow: 1; }
        .column { width: 45%; }

        .row { display: flex; margin-bottom: 15px; height: 65px; }
        .slot, .points { background: #001f3f; border: 3px solid #0074D9; display: flex; align-items: center; font-size: 32px; color: transparent; text-transform: uppercase; box-shadow: inset 0 0 15px rgba(0,0,0,0.5); }
        .slot { flex: 4; padding-left: 20px; justify-content: flex-start; border-right: none; }
        .points { flex: 1; justify-content: center; border-left: 2px solid #0074D9; }
        
        .revealed { color: #FFDC00 !important; border-color: #FFDC00 !important; text-shadow: 2px 2px #000; box-shadow: 0 0 15px #FFDC00; }
        .total-area { font-size: 70px; color: #FFDC00; margin-top: 10px; border-top: 2px solid #333; padding-top: 10px; }

        /* Judge Styling */
        #judge-view { display: none; background: #222; padding: 20px; text-align: left; }
        .judge-col { border: 1px solid #444; padding: 10px; margin-bottom: 20px; border-radius: 10px; }
        .ctrl-row { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
        input { padding: 10px; border-radius: 4px; border: none; }
        button { padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; background: #0074D9; color: white; }
        .btn-pts { background: #2ECC40; }
        .btn-timer { background: #FF4136; font-size: 18px; padding: 15px; margin: 10px; }
    </style>
</head>
<body>

    <div id="board-view">
        <div class="timer" id="timer-disp">--</div>
        <div class="board-container">
            <div class="column" id="col-0"></div> <div class="column" id="col-1"></div> </div>
        <div class="total-area">TOTAL: <span id="grand-total">0</span></div>
    </div>

    <div id="judge-view">
        <h1 style="text-align:center; color:#FFDC00;">JUDGE CONTROL PANEL</h1>
        <div style="text-align:center;">
            <button class="btn-timer" onclick="sendTimer(20)">START 20s</button>
            <button class="btn-timer" onclick="sendTimer(25)">START 25s</button>
            <button class="btn-timer" style="background:#FF851B" onclick="sendAction('duplicate')">DUPLICATE</button>
        </div>
        
        <div id="judge-sections"></div>
    </div>

    <audio id="sfx-ans-reveal" src="fm-Answer-Reveal.wav"></audio>
    <audio id="sfx-duplicate" src="fm-Duplicate.wav"></audio>
    <audio id="sfx-pts-reveal" src="fm-Points-Reveal.wav"></audio>
    <audio id="sfx-zero" src="fm-Zero-Points.wav"></audio>
    <audio id="sfx-win" src="fm-win.wav"></audio>
    <audio id="sfx-20" src="20-sec.wav"></audio>
    <audio id="sfx-25" src="25-sec.wav"></audio>
    <audio id="sfx-buzzer" src="buzzer.wav"></audio>

    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const isJudge = urlParams.get('role') === 'judge';
        let hasWon = false;
// --- AUDIO UNLOCK (copy exactly) ---
    let audioUnlocked = false;

    function unlockAudioOnce() {
        if (audioUnlocked) return;

        document.querySelectorAll('audio').forEach(sound => {
            sound.volume = 0;
            sound.play().then(() => {
                sound.pause();
                sound.currentTime = 0;
                sound.volume = 1;
            }).catch(() => {});
        });

        audioUnlocked = true;
    }

    document.addEventListener('click', unlockAudioOnce);
    document.addEventListener('keydown', unlockAudioOnce);
    // --- END AUDIO UNLOCK ---
        if (isJudge) {
            document.getElementById('board-view').style.display = 'none';
            document.getElementById('judge-view').style.display = 'block';
        }

        // Build the 5x2 board and judge inputs
        for (let col = 0; col < 2; col++) {
            let judgeHtml = `<div class="judge-col"><h3>Player ${col+1}</h3>`;
            for (let row = 0; row < 5; row++) {
                let id = (col * 5) + row;
                // Add to Board
                document.getElementById('col-' + col).innerHTML += `
                    <div class="row">
                        <div class="slot" id="ans-${id}"></div>
                        <div class="points" id="pts-${id}">0</div>
                    </div>`;
                // Add to Judge
                judgeHtml += `
                    <div class="ctrl-row">
                        <input id="in-ans-${id}" placeholder="Ans ${row+1}" style="width:120px">
                        <button onclick="sendAction('reveal-ans', ${id})">ANS</button>
                        <input id="in-pts-${id}" type="number" placeholder="Pts" style="width:50px">
                        <button class="btn-pts" onclick="sendAction('reveal-pts', ${id})">PTS</button>
                    </div>`;
            }
            document.getElementById('judge-sections').innerHTML += judgeHtml + `</div>`;
        }

        function sendAction(type, index) {
            socket.emit('reveal-action', {
                type: type,
                index: index,
                ans: index !== undefined ? document.getElementById('in-ans-'+index).value : '',
                pts: index !== undefined ? document.getElementById('in-pts-'+index).value : 0
            });
        }

        function sendTimer(s) { socket.emit('start-timer', s); }

        socket.on('show-on-board', (data) => {
            const a = document.getElementById('ans-'+data.index);
            const p = document.getElementById('pts-'+data.index);
            
            if (data.type === 'reveal-ans') {
                a.innerText = data.ans;
                a.classList.add('revealed');
                document.getElementById('sfx-ans-reveal').play();
            } 
            else if (data.type === 'reveal-pts') {
                p.innerText = data.pts;
                p.classList.add('revealed');
                if (parseInt(data.pts) > 0) document.getElementById('sfx-pts-reveal').play();
                else document.getElementById('sfx-zero').play();
                calcTotal();
            }
            else if (data.type === 'duplicate') {
                document.getElementById('sfx-duplicate').play();
            }
        });

        socket.on('run-timer', (s) => {
            let count = s;
            const t = document.getElementById('timer-disp');
            const sound = document.getElementById('sfx-' + s);
            if(sound) sound.play();
            
            const itv = setInterval(() => {
                count--;
                t.innerText = (count < 10 ? '0' : '') + count;
                if(count <= 0) { 
                    clearInterval(itv); 
                    document.getElementById('sfx-buzzer').play();
                }
            }, 1000);
        });

        function calcTotal() {
            let t = 0;
            document.querySelectorAll('.points.revealed').forEach(el => t += parseInt(el.innerText) || 0);
            document.getElementById('grand-total').innerText = t;
            if (t >= 200 && !hasWon) {
                hasWon = true;
                document.getElementById('sfx-win').play();
            }
        }
    </script>
</body>
</html>
